apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db-container
        image: db-image
        ports:
        - containerPort: 80
        env:
        - name: VAR1
          value: var1_value
        - name: VAR2
          value: var2_value