# KUBERNETES SECURITY CONTEXT
# A Security Context in Kubernetes defines privileges and access controls for a pod or a container. 
# It sets specific rules for how the container or pod should run, like which user it runs as, whether it can access certain files, or if it should run in a secure way.

# Pass security context on pod level
apiVersion: v1
kind: Pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  securityContext:
    runAsUser: 1000 # USER ID
  containers:
    - name: firstcontainer
      image: coolgourav147/nginx-custom
      env:
        - name: VAR1
          value: var1_value
        - name: VAR2
          value: var2_value
    - name: secondcontainer
      image: myprivateregistry.com:5000/nginx-custom  
      env:
        - name: VAR1
          value: var1_value
        - name: VAR2
          value: var2_value


# Pass security context on container level
apiVersion: v1
kind: Pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  containers:
    - name: firstcontainer
      image: coolgourav147/nginx-custom
      env:
        - name: VAR1
          value: var1_value
        - name: VAR2
          value: var2_value
      securityContext:
        runAsUser: 1000 # USER ID

