# VOLUMES IN KUBERNETES


# VOLUME INSIDE A POD
#An emptyDir volume is created when a Pod is assigned to a Node. It remains as long as that Pod is running on that Node. The data in an emptyDir volume can be shared between containers in the same Pod.
#The emptyDir volume starts empty and can be used to store transient data that you don’t want to persist beyond the lifetime of the Pod. For instance, cache data, workspaces for processing data, etc.
#If the Pod is removed from the Node for any reason, the data in the emptyDir is deleted forever.

apiVersion: v1
kind: pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  containers:
    - name: firstcontainer
      image: coolgourav147/nginx-custom
      volumeMounts:
        - mountPath: /data
          name: first-volume
      env:
        - name: VAR1
          value: var1_value
        - name: VAR2
          value: var2_value
    - name: secondcontainer
      image: coolgourav147/nginx-custom
      env:
        - name: VAR1
          value: var1_value
        - name: VAR2
          value: var2_value
  volumes:
    - name: first-volume
      emptyDir: {}


# VOLUME ON A NODE HOST ( SO THAT THE DATA IS SAFE EVEN IF POD IS DESTROYED )
# LIMITATION: Suppose the volume is on node1 and the pod scheduled on node2, then this will not work, this will work perfectly in single node cluster
# FOR ELIMINATING THIS LIMITATION, USE PERSISTENT VOLUMES
apiVersion: v1
kind: pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  containers:
    - name: firstcontainer
      image: coolgourav147/nginx-custom
      volumeMounts:
        - mountPath: /data
          name: first-volume
      env:
        - name: VAR1
          value: var1_value
        - name: VAR2
          value: var2_value
  volumes:
    - name: first-volume
      hostPath:
        path: /tmp/data



  
# VOLUME ON A EXTERNAL SERVICE ( SO THAT THE DATA IS SAFE EVEN IF POD IS DESTROYED && SUPPORTS MULTINODE CLUSTER )
# There are many external services that can be integrated, the example below is for Amazon EBS
apiVersion: v1
kind: Pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  containers:
    - name: firstcontainer
      image: coolgourav147/nginx-custom
      volumeMounts:
        - mountPath: /data
          name: first-volume
      env:
        - name: VAR1
          value: var1_value
        - name: VAR2
          value: var2_value
  volumes:
    - name: first-volume
      awsElasticBlockstore:
        volumeID: <volume-id>
        fsType: ext4      


