# PASSING SECRETS INSIDE A POD

apiVersion: v1
kind: Pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  containers:

    # FETCHING A PARTICULAR KEY FROM THE SECRET AND PASS AS CUSTOM ENVIRONMENT VARIABLE
    - name: firstcontainer
      image: coolgourav147/nginx-custom
      env:
        - name: myvariable
          valueFrom:
            secretKeyRef: 
              key: var1   # This is the key name which you want to fetch from a secret
              name: my-secret # This is the name of the secret

    # PASS ALL VARS & VALUES FROM A SECRET TO A CONTAINER        
    - name: secondcontainer
      image: coolgourav147/nginx-custom
      envFrom:
          - secretRef:
              name: <secret name>

  
    # PASS SECRETS AS A FILE IN CONTAINERS
    - name: thirdcontainer
      image: coolgourav147/nginx-custom
      volumeMounts:
        - mountPath: /secrets   # this is the path where the files will be mounted inside containers
          name: <volume name>

  volumes:
    - name: <volume name>
      secret:
        secretName: myenvsecret
        
