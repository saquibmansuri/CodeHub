# NODE SELECTOR
# THIS LETS US CHOOSE THAT THE PODS SHOULD BE CREATED ON A PARTICULAR NODE WHERE A PARTICULAR LABEL IS ATTACHED
# LIMITATIONS: Suppose there are three nodes with label size=small, size=medium & size=large respectively & we want to deploy pods only on nodes where size is either small or large. This can't be done with nodeSelector

# EXAMPLE- kubectl label nodes <node name> size=large

apiVersion: v1
kind: Pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  nodeSelector:
    size: "large"   # ONLY 1 LABEL CAN BE ADDED WHICH IS ONE OF THE LIMITATION OF NODE SELECTOR
  containers:
    - name: firstcontainer
      image: coolgourav147/nginx-custom
      env:
        - name: VAR1
          value: var1_value
        - name: VAR2
          value: var2_value


