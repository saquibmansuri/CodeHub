# NODE AFFINITY
# Node affinity in Kubernetes is a set of rules used by the scheduler to determine where a pod can be placed based on node labels. 
# It allows you to constrain which nodes your pod is eligible to be scheduled based on labels on nodes. It's like a "soft rule" compared to node selectors, which are "hard rules."

#Types of Node Affinity
#There are mainly two types of node affinity:

#RequiredDuringSchedulingIgnoredDuringExecution: The scheduler can only place the pod on a node if it meets the conditions. If the conditions are not met, the pod will not be scheduled.
#PreferredDuringSchedulingIgnoredDuringExecution: The scheduler will try to place the pod on nodes that meet the conditions, but if it is not possible, the pod will be scheduled on a node that does not meet the conditions.


# EXAMPLE- kubectl label nodes <node name 1> size=small && kubectl label nodes <node name 2> size=medium && kubectl label nodes <node name 3> size=large


# below will check for a label value of nodes, if it is there then its okay, otherwise it will still create a pod, because 'preferred'/soft scheduling is performed here
apiVersion: v1
kind: Pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: "size"
                operator: "In"
                values:
                  - "extrasmall"
        weight: 1  # usefull when multiple affinities are defined
  containers:
    - name: firstcontainer
      image: coolgourav147/nginx-custom


# this will create a pod in the nodes only if the label value matches any of the values specified here
apiVersion: v1
kind: Pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: "size"
                operator: "In"
                values:
                  - "large"
                  - "small"
  containers:
    - name: firstcontainer
      image: coolgourav147/nginx-custom

