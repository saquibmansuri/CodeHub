# ADDING TOLERANCE PROPERTIES
# assuming that this taint is applied on node
# kubectl taint node <node name> mysize=large:NoSchedule
# If the tolerance matches with the taint specified on the node, then only it will be allowed on that node, otherwise it will be scheduled on other nodes


# USING EQUAL OPERATOR
# When the operator is set to Equal, the pod will tolerate a taint only if both the key and value of the taint match what is specified in the toleration. You must specify both key and value when using operator: Equal.
# Use Case: This is useful when you want to ensure that the pod is scheduled on nodes with a taint that has a precise key-value pair.

apiVersion: v1
kind: pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  containers:
    - name: firstcontainer
      image: coolgourav147/nginx-custom
      env:
        - name: VAR1
          value: var1_value
        - name: VAR2
          value: var2_value
  tolerations:
    - effect: "NoSchedule"
      key: "mysize"
      operator: "Equal"
      value: "large"


# USING EXISTS OPERATOR
# When the operator is set to Exists, the pod will tolerate any taint that has a matching key, regardless of the taint’s value. The toleration does not specify a value field when operator: Exists is used.
# Use Case: This is used when you don't care about the taint's value but want to ensure the pod can be scheduled on a node with a specific taint key.

apiVersion: v1
kind: pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  containers:
    - name: firstcontainer
      image: coolgourav147/nginx-custom
      env:
        - name: VAR1
          value: var1_value
        - name: VAR2
          value: var2_value
  tolerations:
    - effect: "NoSchedule"
      key: "mysize"
      operator: "Exists"



# IF OPERATOR IS EXISTS AND NO KEY SPECIFIED & NO EFFECT SPECIFIED
# THIS WILL ALLOW POD TO TOLERATE ANYKIND OF TAINT, INSHORT IT WILL BYPASS ALL KINDS OF TAINTS

tolerations:
  - effect: ""
    key: ""
    operator: "Exists"


# The tolerationSeconds field in a Kubernetes toleration specifies the amount of time that a pod will continue to run on a node after the node has acquired a new taint that the pod does not already tolerate. 
# This field is only applicable to the NoExecute effect.
# Usecase: This mechanism is useful for giving administrators and systems some time to handle the taint effects, possibly to clean up or save the state before the pod is terminated.

tolerations:
  - effect: "NoExecute"
    key: "mysize"
    operator: "Equal"
    value: "large"
    tolerationSeconds: 60


