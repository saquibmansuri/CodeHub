# Resource request & request limit
# Same templates can be used in deployments and relica sets, etc
# If we only set limits and do not set requests, then automatically it will set requests similar to limits 

apiVersion: v1
kind: pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
containers:
  - name: firstcontainer
    image: coolgourav147/nginx-custom
    resources:
      requests:
        memory: 100Mi   # 200M OR 200Mi, for gb it is Gi
        cpu: 100m       # 0.1  
      limits:
        memory: 200Mi
        cpu: 200m
    env:
      - name: VAR1
        value: var1_value
      - name: VAR2
        value: var2_value
  - name: secondcontainer
    image: coolgourav147/nginx-custom
    env:
      - name: VAR1
        value: var1_value
      - name: VAR2
        value: var2_value
initContainers:
  - name: initcontainer1
    image: coolgourav147/nginx-custom
    env:
      - name: VAR1
        value: var1_value
      - name: VAR2
        value: var2_value
    args: [ "sleep","10" ]
  - name: initcontainer2
    image: coolgourav147/nginx-custom
    env:
      - name: VAR1
        value: var1_value
      - name: VAR2
        value: var2_value
    args: [ "sleep","20" ]


######################################################################

# PASSING CONFIGMAP IN A POD

apiVersion: v1
kind: pod
metadata:
  name: firstpod
  labels:
    type: apiapp
spec:
  containers:

    # INJECT PARTICULAR KEY INSIDE A CONFIGMAP
    - name: firstcontainer
      image: coolgourav147/nginx-custom
      env:
       -name: NameOfVariableThatYouWantInsidePod
        valueFrom:
          configMapKeyRef:
            name:  <configmap name>
            key: <key name inside config map>
  
    # PASS ALL KEYS           
    - name: secondcontainer
      image: coolgourav147/nginx-custom
      envFrom:
        valueFrom:
          - configMapRef:
              name:  <configmap name>
              
    # PASS CONFIGMAPS AS FILES, POSSIBLE THROUGH VOLUMES
    - name: thirdcontainer
      image: coolgourav147/nginx-custom
      volumeMounts:
       - name: <volume name> # this should be same as the name of the volume
         mountPath: "/config" # the values will be visible in this location  
         readOnly: true
  volumes:
    - name: <volume name>
      configMap:
        name: <configmap name>


